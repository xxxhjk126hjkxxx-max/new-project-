* {
  box-sizing: border-box;
}

:root {
  --primary: #0a3d73;
  --primary-dark: #052c53;
  --secondary: #1f8f5f;
  --light: #f4f8fb;
  --white: #ffffff;
  --text: #1a2433;
  --muted: #6b7a90;
  --danger: #d64444;
  --success: #1a9b5b;
  --warning: #d9a63d;
  --border: #dfeaf3;
}

body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg, #edf4fb 0%, #dfeaf5 100%);
  color: var(--text);
}

img {
  max-width: 100%;
  display: block;
}

button,
input,
select {
  font: inherit;
}

.page-shell {
  min-height: 100vh;
}

.login-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.login-card {
  width: min(100%, 460px);
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(10, 61, 115, 0.12);
  border-radius: 22px;
  box-shadow: 0 20px 65px rgba(9, 51, 97, 0.12);
  padding: 28px 24px;
}

.brand-wrap {
  text-align: center;
  margin-bottom: 20px;
}

.brand-logo {
  width: 170px;
  margin: 0 auto 10px;
}

.brand-wrap h1 {
  margin: 4px 0 6px;
  color: var(--primary);
  font-size: clamp(1.7rem, 4vw, 2.3rem);
}

.brand-wrap p {
  margin: 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.auth-form label {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-weight: 600;
  color: var(--text);
}

.auth-form input,
.student-form input,
.student-form select,
.filter-panel select {
  width: 100%;
  border: 1px solid var(--border);
  background: #f8fbff;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 1rem;
  color: var(--text);
}

button,
.button-link,
.mini-btn,
.danger-btn {
  border: none;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s ease;
}

button,
.button-link {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: var(--white);
  padding: 12px 18px;
  font-weight: 700;
}

.secondary {
  background: #eef5fa !important;
  color: var(--primary) !important;
}

.login-note {
  margin-top: 18px;
  background: #eef6f1;
  border-radius: 12px;
  color: var(--secondary);
  padding: 12px 14px;
  font-size: 0.92rem;
  line-height: 1.8;
}

.flash {
  margin: 12px 0;
  border-radius: 10px;
  padding: 10px 12px;
  font-weight: 600;
}

.flash.success {
  background: #eafaf2;
  color: var(--success);
}

.flash.error {
  background: #fdeaea;
  color: var(--danger);
}

.dashboard-shell {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary) 100%);
  padding: 22px 16px;
  color: var(--white);
}

.brand-mini {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

.brand-mini img {
  width: 42px;
}

.brand-mini span {
  font-size: 1.5rem;
  font-weight: 800;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--white);
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 12px 14px;
  font-weight: 700;
}

.nav-item.active,
.nav-item:hover {
  background: rgba(255,255,255,0.14);
}

.nav-item.logout {
  margin-top: 18px;
  background: rgba(214, 68, 68, 0.2);
}

.main-panel {
  padding: 26px 28px 40px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}

.topbar h2 {
  margin: 0;
  color: var(--primary-dark);
  font-size: clamp(1.5rem, 3vw, 2rem);
}

.admin-tag {
  background: rgba(10,61,115,0.1);
  color: var(--primary-dark);
  padding: 8px 12px;
  border-radius: 999px;
  font-weight: 700;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(150px, 1fr));
  gap: 20px;
  margin-bottom: 22px;
}

.stat-card, .panel {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(13, 59, 102, 0.05);
}

.stat-card {
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.stat-card span {
  color: var(--muted);
  font-size: 0.95rem;
}

.stat-card strong {
  color: var(--primary-dark);
  font-size: clamp(1.8rem, 4vw, 2.5rem);
}

.cards-row {
  display: grid;
  grid-template-columns: 1fr;
}

.panel {
  padding: 18px 18px 22px;
  margin-bottom: 16px;
}

.panel h3 {
  margin-top: 0;
  margin-bottom: 16px;
  color: var(--primary-dark);
}

.list-simple {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.list-simple li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #f7fbff;
}

.list-simple strong,
.list-simple small {
  display: block;
}

.list-simple small {
  color: var(--muted);
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(160px, 1fr));
  gap: 18px;
}

.student-form label,
.filter-panel label {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-weight: 700;
  color: var(--text);
}

.student-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.mini-btn, .danger-btn {
  padding: 8px 12px;
  font-weight: 700;
}

.mini-btn {
  background: #edf6ff;
  color: var(--primary-dark);
}

.danger-btn {
  background: #ffe7e7;
  color: var(--danger);
}

.table-panel {
  overflow: hidden;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}

th,
td {
  text-align: right;
  padding: 12px 10px;
  border-bottom: 1px solid var(--border);
}

th {
  background: #f5f9ff;
  color: var(--primary-dark);
}

.inline-actions {
  display: flex;
  justify-content: flex-start;
}

.qr-panel {
  text-align: center;
}

.qr-box {
  display: flex;
  justify-content: center;
  margin: 18px auto;
  padding: 18px;
  background: #f8fbff;
  border: 1px solid var(--border);
  border-radius: 18px;
  width: min(100%, 360px);
}

.qr-box img {
  width: 240px;
  height: 240px;
}

.qr-actions {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.filter-panel select {
  padding: 12px 14px;
}

.scanner-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.scanner-status {
  border-radius: 12px;
  background: #edf5ff;
  padding: 10px 14px;
  font-weight: 700;
  color: var(--primary-dark);
}

.scanner-status.success {
  background: #eafaf2;
  color: var(--success);
}

.scanner-status.error {
  background: #fdeaea;
  color: var(--danger);
}

.reader-area {
  width: min(100%, 500px);
  margin: 0 auto;
}

.reader-area video {
  width: 100%;
  border-radius: 18px;
  background: #000;
}

@media (max-width: 900px) {
  .dashboard-shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    padding: 18px 14px 12px;
  }

  .nav {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
  }

  .nav-item {
    min-width: 120px;
  }

  .stats-grid,
  .field-grid {
    grid-template-columns: 1fr;
  }
}
