{% extends 'base.html' %}
{% block content %}
<div class="app-layout"><aside class="sidebar"><a class="brand" href="{{ url_for('dashboard') }}"><img src="{{ url_for('static', filename='images/iua_logo.svg') }}" alt="IUA"><span><b>IUA</b><small>الحضور الأكاديمي</small></span></a><nav><a class="nav-link" href="{{ url_for('dashboard') }}">الرئيسية</a><a class="nav-link active" href="{{ url_for('students') }}">إدارة الطلاب</a><a class="nav-link" href="{{ url_for('lectures') }}">المحاضرات</a><a class="nav-link" href="{{ url_for('reports') }}">تقارير الحضور</a></nav><form class="logout-form" method="post" action="{{ url_for('logout') }}"><button class="nav-link logout" type="submit">تسجيل ال��روج</button></form><div class="sidebar-caption">جامعة أفريقيا الدولية</div></aside>
<main class="main-content"><header class="topbar"><div><p class="eyebrow">بطاقة الطالب</p><h1>رمز QR</h1></div><a class="button secondary" href="{{ url_for('students') }}">العودة للطلاب</a></header><section class="panel qr-card"><img class="qr-image" src="{{ qr_url }}" alt="رمز QR للطالب {{ student.name }}"><h2>{{ student.name }}</h2><p class="muted">رقم الطالب: {{ student.student_number }} · {{ student.grade_group }}</p><div class="actions center"><a class="button primary" href="{{ url_for('download_qr', student_id=student.id) }}">تحميل صورة QR</a><button class="button secondary" onclick="window.print()">طباعة</button></div></section></main></div>
{% endblock %}
